<p>To reduce the harmful effects of smoke on public health, open burning is banned within the <a href="/en/about-the-air-district/in-your-community">Air District&rsquo;s boundaries</a>, except for the 17 burn types defined by the <a href="/~/media/dotgov/files/rules/reg-6-rule-3-woodburning-devices/2025-amendment/documents/20250930_rg0500_final-pdf.pdf?rev=602d0aad51784921a2b7ba74c870e7ad&sc_lang=en">Open Burning Regulation</a><span class="icon-inline icon-file-pdf-o"></span><span class="document-meta-data">(197 Kb PDF, 14 pgs, revised 10/1/2025)</span>. </p>
