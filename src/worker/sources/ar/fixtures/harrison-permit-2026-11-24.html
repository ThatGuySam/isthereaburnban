<script type="text/javascript">window.clientWorkStateTemp = JSON.parse("{\"page\":{\"id\":1687328,\"status\":\"published\",\"content\":{\"structure\":{\"id\":\"root\",\"nodes\":[{\"id\":\"bdab4bd7-3fb6-451c-bc81-de4217fdc646\",\"nodes\":[{\"nodes\":[{\"id\":\"d351b098-4f4e-4721-b706-7c3a3f1efc82\",\"content\":{\"html\":\"<p style=\\\"text-align: left\\\"><span style=\\\"font-size: 16px\\\"><strong>Harrison City Ordinance Number: 1538 - 11.03.04 Prohibited Burning</strong></span><br>&nbsp;(a)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp; </span>The Harrison Fire Chief and/or his designee may impose a burn ban within the incorporated limits of Harrison separate of any county or state issued burn ban.</p><p style=\\\"text-align: left\\\">(b)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp; </span>The Harrison Fire Department shall approve all outdoor burning. A burn permit shall be obtained from the Harrison Fire Department prior to kindling of any non-recreational fire.</p><p style=\\\"text-align: left\\\">(i.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>Permits for non-recreational fires are valid for the day it was issued and allowed to burn between dawn to dusk.</p><p style=\\\"text-align: left\\\">(ii.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;&nbsp;</span>Only small limbs, leaves, and grass clippings shall be permitted to be burned within the city limits of Harrison.</p><p style=\\\"text-align: left\\\">(iii.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;</span>The person igniting any fire shall be in attendance with the fire at all times, and shall keep some type of extinguishing agent readily available at all times while the fire is burning.</p><p style=\\\"text-align: left\\\">(iv.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;</span>Use of accelerants on any fire is prohibited.</p><p style=\\\"text-align: left\\\">(v.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;&nbsp;</span>Officials with the City of Harrison Fire Department shall personally inspect and approve any burn requests for brush piles resulting from land clearing.</p><p style=\\\"text-align: left\\\">(c)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp; </span>Person(s), businesses, organizations, groups or the like are prohibited from burning anything other than small limbs, leaves and grass clippings with or without a burn permit. Burning of trash, rubbish, tires, trade waste, etc. is prohibited.</p><p style=\\\"text-align: left\\\">(d)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp; </span>Recreational fires are outdoor fires used for pleasure, cooking, warmth, or ceremonial purposes. Recreational fires do not require a permit, but must be in compliance with the following conditions prior to burning.&nbsp;&nbsp;</p><p style=\\\"text-align: left\\\">(i.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>Burning of recreational fires shall be no closer than 10 feet to any structure and no larger than 2 feet tall by 3 feet in diameter.</p><p style=\\\"text-align: left\\\">(ii.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;&nbsp;</span>Recreational fires shall consist of small limbs or logs no larger than 6 inches in diameter.</p><p style=\\\"text-align: left\\\">(iii.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;</span>Recreational fires shall be contained by a fire ring made of brick, stone, metal or commercially designed fire pit.</p><p style=\\\"text-align: left\\\">(iv.)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp;</span>Recreational fires are allowed all time of day, but in accordance with (a.) and (b.)(iii.)(iv.))</p><p style=\\\"text-align: left\\\">(e)<span style=\\\"font-size: 16px\\\">&nbsp;&nbsp;&nbsp; </span>Smoke from any fire which becomes a nuisance to any neighbors or the general public, the Harrison Fire Department may order any fire to be extinguished or cause the fire to be extinguished.</p><p style=\\\"text-align: left\\\">Open burning permits can be obtained from the Harrison Fire Department located at 118 Industrial Park Road. You may call or come in for a permit. Individuals are encouraged&nbsp;to call ahead to make sure the officer in charge&nbsp;will be issuing burning permits,<strong> (870)-741-6384</strong>. </p><p style=\\\"text-align: left\\\">For burn ban and wildfire danger information please click on the following link to view the&nbsp;<a target=\\\"_blank\\\" rel=\\\"noopener noreferrer nofollow\\\" href=\\\"http://www.arkfireinfo.org/index.php?do%3AshowBurnBans&amp;fbclid=IwAR272UL0X-NOnf0RmZ__fsNb1rDz_bwIPlO30oYuJ0s6XuNmiVEvfGYQ2lc%C2%A0\\\">Arkansas Forestry Commission</a>.</p>\"}}]}]}]}}}}")</script>
