<div class="section_content content" id="49961698_content" title-footnotes="0"><div class="para">Before initiating any outdoor burning, a responsible person shall obtain and read the permit, and thereafter keep a copy of the permit at the burn site or on their person until the fire is completely extinguished.</div><div class="history">(<span class="legref" data-ref=""><span class="loclaw">Ord. 319</span> § 2 (Exh. A), <span class="hisdate">2020</span></span>)</div><div class="footnotes"></div></div>                </article>
