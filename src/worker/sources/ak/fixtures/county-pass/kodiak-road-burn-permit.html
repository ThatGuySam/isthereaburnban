<p>Kodiak Island Borough <a href="https://kodiakisland.borough.codes/KIBC/8.35" target="_blank" title="link to Borough Code Section" class="Hyperlink">Code 8.35</a> requires that anyone on the road system conducting open burning must have a burn permit. Those wanting to conduct open burning inside the city limits or on Coast Guard Property must obtain a different permit by contacting those agencies.</p>
