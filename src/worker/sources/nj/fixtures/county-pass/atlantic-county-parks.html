<div class="section_content content" id="8929971_content" title-footnotes="0"><div class="para">No person shall cause or allow a fire to be lit or burn in a County parks area except in designated areas. All fires must be attended by a responsible individual of at least 16 years of age.</div><div class="footnotes"></div></div>                </article>
