        The City of Cleveland does not issue burn permits, but residents must contact the Cleveland Fire Department at (423) 476-6713 to get an Approval to Burn.<br>
<br>
For county residents, please call the Tennessee Division of Forestry at (423) 478-0337 for a burn permit.
