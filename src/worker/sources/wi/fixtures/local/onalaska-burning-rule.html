<div class="section_content content" id="39799867_content" title-footnotes="0"><div class="level"><div class="litem" id="39799868"><a alt="7.07.23A" class="litem_number" href="39799868#39799868" onclick="return false;" title="7.07.23A">A. </a><div class="litem_content content"><div class="para"><b class="bold">Prohibition.</b> No person shall conduct open burning or cause a controlled burn in the City of Onalaska.</div><div class="footnotes"></div></div></div><div class="litem" id="39799869"><a alt="7.07.23B" class="litem_number" href="39799869#39799869" onclick="return false;" title="7.07.23B">B. </a><div class="litem_content content"><div class="para"><b class="bold">Fire Department practice burns.</b> The Onalaska Fire Department may conduct open burning if necessary for fire-fighting practice and no permits are required for such activities.</div><div class="footnotes"></div></div></div></div><div class="footnotes"></div></div>
